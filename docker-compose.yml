services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  vectorprism:
    build: .
    command: python -m bench.services.vectorprism
    environment:
      QDRANT_URL: http://qdrant:6333
      VECTORPRISM_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      qdrant:
        condition: service_healthy

  chorusgraph:
    build: .
    command: python -m bench.services.chorusgraph
    environment:
      CHORUSGRAPH_PORT: "8082"
    ports:
      - "8082:8082"
