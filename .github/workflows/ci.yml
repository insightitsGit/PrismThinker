name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,validation]"
      - name: Test
        run: pytest -q
      - name: Isolation coverage
        run: >
          pytest -q tests/test_isolation.py
          --cov=prismthinker.core.isolation
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Predicate coverage
        run: >
          pytest -q tests/test_predicates.py
          --cov=prismthinker.core.predicates
          --cov-report=term-missing
          --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build and check
        run: |
          python -m build
          python -m twine check dist/*
