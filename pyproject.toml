[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismthinker"
version = "1.1.0"
description = "Model-agnostic, disagreement-aware epistemic reasoning coprocessor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bench = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "qdrant-client>=1.9",
]
latent = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
