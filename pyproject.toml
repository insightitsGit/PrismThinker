[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismthinker"
version = "1.2.0"
description = "Deterministic pre-execution firewall for AI agent tool calls. Policy vetoes, contradiction-preserving guardrails, and counterfactual recovery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amin Parva" },
]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "guardrails",
    "llm-guardrails",
    "agent-firewall",
    "tool-calling",
    "deterministic-guardrails",
    "ai-safety",
    "epistemic",
    "reasoning",
    "governance",
    "rag",
    "decision-graph",
    "policy",
    "contradiction",
    "langchain",
    "langgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/insightitsGit/PrismThinker"
Repository = "https://github.com/insightitsGit/PrismThinker"
Issues = "https://github.com/insightitsGit/PrismThinker/issues"

[project.optional-dependencies]
validation = [
    "numpy>=1.25",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.0",
]
bench = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "qdrant-client>=1.9",
]
latent = [
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prismthinker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
pythonpath = ["src", "."]
addopts = "-q"
